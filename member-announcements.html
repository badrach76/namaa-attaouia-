<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#1b4d3e"><title>إعلانات الإدارة | جمعية نماء العطاوية</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="member-portal-page"><header><div class="navbar"><a href="user-dashboard.html" class="logo-area"><img src="1000096843.jpg" alt="شعار جمعية نماء" class="logo-img"><div class="logo-text"><h1>جمعية نماء العطاوية</h1><span>فضاء المنخرط المهني</span></div></a><a class="member-logout" href="user-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a></div></header><main class="container member-portal-container"><a class="member-back-link" href="user-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية لفضاء المنخرط</a><section class="member-portal-heading"><h3><i class="fa-solid fa-bullhorn"></i> إعلانات الإدارة</h3><p class="member-section-note">آخر الإعلانات التي تنشرها الإدارة للمنخرطين.</p></section><section class="member-portal-card"><div id="member-announcements-list"><p>جارٍ تحميل الإعلانات…</p></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{const box=document.getElementById('member-announcements-list');try{const {data,error}=await supabaseClient.from('member_announcements').select('*').order('created_at',{ascending:false});if(error)throw error;if(!data?.length){box.innerHTML='<p class="empty-state">لا توجد إعلانات منشورة حالياً.</p>';return;}box.innerHTML=data.map(a=>`<article class="member-announcement"><h4>${escapeHTML(a.title||'إعلان إداري')}</h4><p>${escapeHTML(a.body||a.content||'').replace(/\n/g,'<br>')}</p><small>${a.created_at?new Date(a.created_at).toLocaleDateString('ar-MA'):''}</small></article>`).join('');}catch(e){box.innerHTML='<p class="empty-state">تعذر تحميل الإعلانات. تأكد من تنفيذ ملف إعداد الإعلانات المرفق.</p>';}});</script></main><footer><div class="footer-content"><div class="footer-logo"><h2>جمعية نماء العطاوية</h2><p>العطاوية، المغرب</p></div></div><div class="footer-bottom"><p>جميع حقوق النشر محفوظة © 2026 - جمعية نماء العطاوية</p></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('currentMember')) location.href='register.html';});</script></body></html>
