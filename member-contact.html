<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#1b4d3e"><title>التواصل مع الإدارة | جمعية نماء العطاوية</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="member-portal-page"><header><div class="navbar"><a href="user-dashboard.html" class="logo-area"><img src="1000096843.jpg" alt="شعار جمعية نماء" class="logo-img"><div class="logo-text"><h1>جمعية نماء العطاوية</h1><span>فضاء المنخرط المهني</span></div></a><a class="member-logout" href="user-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a></div></header><main class="container member-portal-container"><a class="member-back-link" href="user-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية لفضاء المنخرط</a><section class="member-portal-heading"><h3><i class="fa-solid fa-comments"></i> التواصل مع الإدارة</h3><p class="member-section-note">أرسلوا استفساراتكم ومقترحاتكم إلى إدارة الجمعية.</p></section><section class="member-portal-card member-edit-card"><form id="member-contact-form"><div class="form-group"><label for="mc-topic">موضوع الرسالة</label><select id="mc-topic"><option>استفسار عام</option><option>الانخراط</option><option>التكوين والتأطير</option><option>خدمات الجمعية</option><option>اقتراح أو شراكة</option></select></div><div class="form-group" style="grid-column:1/-1"><label for="mc-message">نص الرسالة</label><textarea id="mc-message" rows="6" required maxlength="4000" placeholder="اكتبوا رسالتكم هنا"></textarea></div><div><button type="submit" class="member-contact-cta" id="mc-submit"><i class="fa-solid fa-paper-plane"></i> إرسال الرسالة</button></div><p id="mc-status" role="status"></p></form></section><script>document.getElementById('member-contact-form').addEventListener('submit',async e=>{e.preventDefault();const m=JSON.parse(sessionStorage.getItem('currentMember')||'null');if(!m){location.href='register.html';return;}const b=document.getElementById('mc-submit'),st=document.getElementById('mc-status');b.disabled=true;try{const {error}=await supabaseClient.from('contact_messages').insert([{name:m.name||'منخرط',phone:m.phone||null,email:null,topic:document.getElementById('mc-topic').value,message:document.getElementById('mc-message').value.trim(),status:'جديدة'}]);if(error)throw error;st.textContent='تم إرسال الرسالة إلى الإدارة.';document.getElementById('member-contact-form').reset();}catch(err){st.textContent='تعذر إرسال الرسالة: '+err.message;}finally{b.disabled=false;}});</script></main><footer><div class="footer-content"><div class="footer-logo"><h2>جمعية نماء العطاوية</h2><p>العطاوية، المغرب</p></div></div><div class="footer-bottom"><p>جميع حقوق النشر محفوظة © 2026 - جمعية نماء العطاوية</p></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{if(!sessionStorage.getItem('currentMember')) location.href='register.html';});</script></body></html>
