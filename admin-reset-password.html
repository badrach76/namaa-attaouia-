<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>استعادة كلمة مرور المشرف | جمعية نماء العطاوية</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header><div class="navbar"><a href="index.html" class="logo-area" style="text-decoration:none"><img src="1000096843.jpg" alt="شعار الجمعية" class="logo-img"><div class="logo-text"><h1>جمعية نماء العطاوية</h1><span>لأصحاب وحدات إنتاج زيت الزيتون</span></div></a><a href="admin-login.html">العودة إلى تسجيل الدخول</a></div></header>
<main class="container" style="max-width:700px;padding-top:36px;padding-bottom:50px"><div class="section-title"><h3>استعادة كلمة مرور المشرف</h3><p>أدخل البريد الإلكتروني المسجل في Supabase، ثم افتح رابط الاستعادة الذي يصلك.</p></div>
<section class="form-box"><form onsubmit="requestAdminPasswordReset(event)"><div class="form-group"><label for="reset-admin-email">البريد الإلكتروني الإداري</label><input id="reset-admin-email" type="email" required autocomplete="email" style="direction:ltr"></div><button class="submit-btn" type="submit">إرسال رابط الاستعادة</button></form></section>
<section class="form-box" style="margin-top:20px"><h3 style="color:var(--primary-green);margin-bottom:10px">تعيين كلمة مرور جديدة</h3><p style="margin-bottom:14px">إذا فتحت هذه الصفحة من رابط الاستعادة المرسل إلى بريدك، أدخل كلمة المرور الجديدة أدناه.</p><form onsubmit="updateAdminPassword(event)"><div class="form-group"><label for="new-admin-password">كلمة المرور الجديدة (10 أحرف على الأقل)</label><input id="new-admin-password" type="password" minlength="10" autocomplete="new-password" required></div><div class="form-group"><label for="confirm-admin-password">تأكيد كلمة المرور</label><input id="confirm-admin-password" type="password" minlength="10" autocomplete="new-password" required></div><button class="submit-btn" type="submit">تحديث كلمة المرور</button></form></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="main.js"></script></body></html>
