<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#1b4d3e"><title>تعديل البيانات | جمعية نماء العطاوية</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="member-portal-page"><header><div class="navbar"><a href="user-dashboard.html" class="logo-area"><img src="1000096843.jpg" alt="شعار جمعية نماء" class="logo-img"><div class="logo-text"><h1>جمعية نماء العطاوية</h1><span>فضاء المنخرط المهني</span></div></a><a class="member-logout" href="user-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية</a></div></header><main class="container member-portal-container"><a class="member-back-link" href="user-dashboard.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى الصفحة الرئيسية لفضاء المنخرط</a><section class="member-portal-heading"><h3><i class="fa-solid fa-user-pen"></i> تعديل البيانات</h3><p class="member-section-note">يمكنكم تحديث الاسم واسم المعصرة ورقم الهاتف وكلمة المرور.</p></section><section class="member-portal-card member-edit-card"><form onsubmit="handleUpdateMemberProfile(event)"><div class="form-group"><label for="update-name">اسم المسير</label><input id="update-name" required></div><div class="form-group"><label for="update-mill">اسم المعصرة</label><input id="update-mill" required></div><div class="form-group"><label for="update-phone">رقم الهاتف</label><input id="update-phone" type="tel" required></div><div class="form-group"><label for="update-pass">كلمة مرور جديدة (اختياري)</label><input id="update-pass" type="password" autocomplete="new-password" placeholder="اتركها فارغة دون تغيير"></div><div><button class="member-contact-cta" type="submit"><i class="fa-solid fa-floppy-disk"></i> حفظ التغييرات</button></div></form></section></main><footer><div class="footer-content"><div class="footer-logo"><h2>جمعية نماء العطاوية</h2><p>العطاوية، المغرب</p></div></div><div class="footer-bottom"><p>جميع حقوق النشر محفوظة © 2026 - جمعية نماء العطاوية</p></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="main.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const m=JSON.parse(sessionStorage.getItem('currentMember')||'null');if(!m){location.href='register.html';return;}[['update-name','name'],['update-mill','mill'],['update-phone','phone']].forEach(([id,key])=>{const e=document.getElementById(id);if(e)e.value=m[key]||'';});});</script></body></html>
