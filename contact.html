<script>
document.getElementById('contact-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';

    const name = document.getElementById('contact-name').value.trim();
    const topic = document.getElementById('contact-topic').value;
    const email = document.getElementById('contact-email').value.trim() || null;
    const phone = document.getElementById('contact-phone').value.trim() || null;
    const message = document.getElementById('contact-message').value.trim();

    try {
        // الاعتماد المباشر على متغير الاتصال القياسي المستخدم في المنصة (_supabase أو supabase)
        const activeSupabase = typeof _supabase !== 'undefined' ? _supabase : (typeof supabase !== 'undefined' ? supabase : null);
        
        if (!activeSupabase) {
            throw new Error('تعذر العثور على إعدادات اتصال قاعدة البيانات.');
        }

        const { data, error } = await activeSupabase.from('contact_messages').insert([
            { name: name, topic: topic, email: email, phone: phone, message: message, status: 'جديدة' }
        ]);

        if (error) throw error;

        alert('تم إرسال رسالتك بنجاح إلى الإدارة! شكراً لتواصلك معنا، سيتم الرد عليك في أقرب وقت.');
        document.getElementById('contact-form').reset();
    } catch (err) {
        console.error(err);
        alert('حدث خطأ أثناء إرسال الرسالة: ' + (err.message || 'يرجى المحاولة لاحقاً.'));
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> إرسال الرسالة إلى الإدارة';
    }
});
</script>
