<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فضاء المنخرط - جمعية نماء العطاوية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #f9f6f0;">

    <header>
        <div class="navbar" style="padding: 15px 5%;">
            <div class="logo-area" style="display: flex; align-items: center; gap: 15px;">
                <img src="1000096843.jpg" alt="شعار جمعية نماء" class="logo-img" style="width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-gold);">
                <div class="logo-text">
                    <h1 style="font-size: 1.2rem; color: var(--primary-green); margin: 0;">جمعية نماء العطاوية</h1>
                    <span style="font-size: 0.8rem; color: #666;">فضاء تسيير المنخرطين والمعاصر</span>
                </div>
            </div>
            <div>
                <button onclick="logoutMember()" style="background: #c0392b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
            </div>
        </div>
    </header>

    <div class="container" style="max-width: 1000px; margin: 30px auto; padding: 0 20px;">
        <div class="section-title" style="text-align: center; margin-bottom: 30px;">
            <h3 style="color: var(--primary-green); font-size: 1.8rem;"><i class="fa-solid fa-user-gear"></i> لوحة تحكم المنخرط المهني</h3>
            <p style="color: #666;">متابعة حالة الانخراط، تحديث بيانات المعصرة، والاطلاع على التكوينات التأطيرية الحصرية</p>
        </div>

        <!-- بطاقة معلومات المنخرط -->
        <div id="user-dashboard-info" style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px; border-top: 5px solid var(--primary-green);">
            <!-- يتم تحميل بيانات المنخرط هنا ديناميكياً -->
        </div>

        <!-- قسم تحديث بيانات الحساب ومعلومات المعصرة -->
        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 30px;">
            <h4 style="color: var(--primary-green); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;"><i class="fa-solid fa-pen-to-square"></i> تحديث بيانات المعصرة والحساب</h4>
            <form onsubmit="handleUpdateMemberProfile(event)" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group" style="grid-column: span 1;">
                    <label style="font-weight: bold; font-size: 0.9rem; color: #444;">اسم المسير / المستغل:</label>
                    <input type="text" id="update-name" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px;">
                </div>
                <div class="form-group" style="grid-column: span 1;">
                    <label style="font-weight: bold; font-size: 0.9rem; color: #444;">اسم المعصرة:</label>
                    <input type="text" id="update-mill" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px;">
                </div>
                <div class="form-group" style="grid-column: span 1;">
                    <label style="font-weight: bold; font-size: 0.9rem; color: #444;">رقم الهاتف:</label>
                    <input type="text" id="update-phone" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px; direction: ltr; text-align: right;">
                </div>
                <div class="form-group" style="grid-column: span 1;">
                    <label style="font-weight: bold; font-size: 0.9rem; color: #444;">كلمة المرور الجديدة:</label>
                    <input type="password" id="update-pass" placeholder="اتركها فارغة إذا لمغن ترغب بتغييرها" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; margin-top: 5px; direction: ltr; text-align: right;">
                </div>
                <div style="grid-column: span 2; text-align: left;">
                    <button type="submit" style="background: var(--accent-gold); color: var(--primary-green); font-weight: bold; padding: 10px 25px; border: none; border-radius: 6px; cursor: pointer;">حفظ التعديلات</button>
                </div>
            </form>
        </div>

        <!-- قسم التكوينات الحصرية للمنخرطين -->
        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 40px;">
            <h4 style="color: var(--primary-green); margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 10px;"><i class="fa-solid fa-graduation-cap"></i> التكوينات والبرامج التأطيرية الحصرية للمنخرطين</h4>
            <div id="member-trainings-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
                <!-- يتم جلب التكوينات الخاصة هنا -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="main.js"></script>
</body>
</html>
